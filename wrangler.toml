name = "telegram-private-chatbot"
main = "worker.js"
compatibility_date = "2024-11-30"

# 全局禁用
workers_dev = false
preview_urls = false

[env.production]
# 生产环境额外确保禁用
workers_dev = false
preview_urls = false

[[routes]]
pattern = "chat.010912.top"
custom_domain = true

[[kv_namespaces]]
binding = "TOPIC_MAP"
id = "b191676605fa442b91a2096c09d11fb1"

# Durable Object：强一致验证/封禁状态存储（规避 KV 边缘缓存延迟）
# 部署时 migrations 会自动创建；若通过 Cloudflare 后台手动部署，
# 需在 Settings → Variables → Durable Object Bindings 中添加 VERIFIER 绑定
[[durable_objects.bindings]]
name = "VERIFIER"
class_name = "Verifier"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Verifier"]

[vars]
SUPERGROUP_ID = "-1003893101194"
TURNSTILE_SITE_KEY = "0x4AAAAAAFNLpM3MQcv_nRH1"

# 注意：以下敏感变量不应写入本文件，请在 Cloudflare 后台配置：
#   BOT_TOKEN             - Telegram 机器人 Token
#   TURNSTILE_SECRET_KEY  - Cloudflare Turnstile 站点 Secret Key（人机验证）
