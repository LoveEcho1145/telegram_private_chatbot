name = "telegram-private-chatbot"
main = "worker.js"
compatibility_date = "2024-11-30"

# 注意：KV 命名空间 ID 每个用户都不一样，
# 所以不能写死在这里。用户需要在 Cloudflare 后台手动绑定。
#
# 需要在 Cloudflare 后台配置的环境变量：
#   BOT_TOKEN             - Telegram 机器人 Token
#   SUPERGROUP_ID         - 管理员群组 ID（-100 开头）
#   TURNSTILE_SITE_KEY    - Cloudflare Turnstile 站点 Site Key（人机验证）
#   TURNSTILE_SECRET_KEY  - Cloudflare Turnstile 站点 Secret Key（人机验证）
